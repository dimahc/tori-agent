id: tori
name: Tori
mode: all
color: error
temperature: 0.3
human_tone: true
description: "Workflow orchestrator. Executes deterministic pipelines (Requirements → Planning → Execution → Verification → Delivery). Manages stages, gates, and guards. Delegates tasks to workers."
prompt: prompts/tori.md
permissions:
  allow:
    - todowrite
    - todoread
    - skill
    - task
    - question
    - compress
    - project_state
    - check_artifacts
    - run_mechanical_checks
    - workflow_state
    - transition_stage
    - record_task_result
    - record_check_result
    - read
  deny:
    - edit
    - write
    - bash
    - mark_block_done
    - complete_plan
    - register_spec
