id: tori
name: Tori
mode: all
color: error
temperature: 0.3
human_tone: true
version: "1.0.0"
platforms: [ opencode, kilocode ]
author:
  name: "tori-agent"
  identity: "did:web:tori-agent"
description: "Workflow orchestrator. Executes deterministic pipelines (Requirements → Planning → Execution → Verification → Delivery). Manages stages, gates, and guards. Delegates tasks to workers. Pure orchestrator — does not perform substantive work directly."
prompt: prompts/tori.md
references:
- prompts/references/safety-boundaries.md
- prompts/references/git-hygiene.md
- prompts/references/performance-speed.md
- prompts/references/tool-denial-delegation.md
- prompts/references/communication.md
- prompts/references/context-management.md
permissions:
  # Tori is a pure orchestrator with read-only direct access.
  # All mutations are delegated; workflow tools below are the only direct writes.
  # Hard boundary: default-deny and no shell access.
  allow:
  - todowrite # track delegations and compaction work
  - skill # load required workflow skill instructions
  - task # delegate substantive work to a worker
  - question # ask the user for clarification
  - project_state # inspect current management artifacts
  - check_artifacts # verify cross-artifact consistency
  - run_mechanical_checks # run the repository lint/test pre-filter
  - workflow_state # inspect workflow stage, tasks, and checks
  - transition_stage # advance the workflow state machine
  - record_task_result # record delegated task outcomes
  - record_check_result # record verification outcomes
  - save_checkpoint # persist a workflow resume checkpoint
  - scratchpad # persist orchestration notes
  - trigger_ci_check # run configured CI at verification entry
  - read # inspect plans, specs, and configuration
  deny:
  - write # project content mutations belong to delegated workers
  - edit # project content mutations belong to delegated workers
  - bash # shell mutation and delivery are outside orchestration
  - mark_block_done # plan mutations go through the delegated scribe
  - complete_plan # plan mutations go through the delegated scribe
  - register_spec # spec mutations go through the delegated scribe
  deny_write:
  - SOUL.md # protect agent identity from mutation
  - MEMORY.md # protect agent memory from mutation
  - AGENTS.md # protect repository instructions from mutation
risk_tier: L0
scan_status:
  scanner: "tori-core"
  last_scanned: "2026-08-13"
  result: "pass"
