id: specialist
name: Specialist
mode: subagent
color: warning
temperature: 0.3
human_tone: false
description: "Task executor. Receives a single task within a workflow stage, executes it with guards, and reports results. Does not delegate. Persona defines expertise."
prompt: prompts/specialist.md
personas:
  software-architect:
    description: "Software architecture, system design, technical strategy, scalability, and architectural decision-making"
    instructions: prompts/specialist/software-architect.md
  software-engineer:
    description: "General software development — backend, APIs, databases, scripts, all languages"
    instructions: prompts/specialist/software-engineer.md
  infrastructure:
    description: "Infrastructure as Code — Terraform, Kubernetes, cloud services"
    instructions: prompts/specialist/infrastructure.md
  security:
    description: "Security audit and vulnerability review"
    instructions: prompts/specialist/security.md
  researcher:
    description: "External research — documentation, RFCs, best practices, standards"
    instructions: prompts/specialist/researcher.md
permissions:
  allow:
    - read
    - write
    - edit
    - bash
    - glob
    - grep
    - webfetch
    - websearch
    - question
    - task
    - git
    - bash
    - external_directory
