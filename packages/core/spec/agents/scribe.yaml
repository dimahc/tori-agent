id: scribe
name: Scribe
mode: subagent
color: info
temperature: 0.1
human_tone: false
version: "1.0.0"
platforms: [ opencode, kilocode ]
author:
  name: "tori-agent"
  identity: "did:web:tori-agent"
description: "Stage artifact generator. Produces structured knowledge artifacts at each workflow stage (specs, plans, summaries). Handles write operations when delegated by Tori."
prompt: prompts/scribe.md
modes:
  specification:
    description: "Write agent specifications"
    instructions: prompts/scribe/specification.md
  adr:
    description: "Write Architecture Decision Records"
    instructions: prompts/scribe/adr.md
  release-note:
    description: "Generate release notes"
    instructions: prompts/scribe/release-note.md
  documentation:
    description: "Write README and user-facing documentation"
    instructions: prompts/scribe/documentation.md
  changelog:
    description: "Update CHANGELOG.md"
    instructions: prompts/scribe/changelog.md
  plan:
    description: "Create exec-plans from requirements"
    instructions: prompts/scribe/plan.md
permissions:
  allow:
  - read # inspect existing artifacts and style
  - write # create only delegated artifact paths below
  - edit # update only delegated artifact paths below
  - mark_block_done # check delegated exec-plan blocks
  - complete_plan # complete delegated exec-plans after validation
  - register_spec # create delegated specs through the lifecycle guard
  - glob # discover artifact files
  - grep # search artifact content
  - question # clarify missing artifact requirements
  - project_state # inspect current artifact state
  - check_artifacts # verify artifact consistency
  - run_mechanical_checks # run required lint/test checks
  allow_paths:
    write:
    - .opencode/specs/* # delegated specs
    - .opencode/plans/* # delegated exec-plans
    - .opencode/briefs/* # delegated briefs
    - .opencode/workflows/* # delegated workflow records
    - docs/adr/* # delegated architecture decision records
    - README.md # delegated user-facing documentation
    - CHANGELOG.md # delegated changelog updates
    edit:
    - .opencode/specs/* # delegated specs
    - .opencode/plans/* # delegated exec-plans
    - .opencode/briefs/* # delegated briefs
    - .opencode/workflows/* # delegated workflow records
    - docs/adr/* # delegated architecture decision records
    - README.md # delegated user-facing documentation
    - CHANGELOG.md # delegated changelog updates
  deny:
  - bash # checks use run_mechanical_checks; shell mutations are forbidden
  deny_write:
  - SOUL.md # protect agent identity from mutation
  - MEMORY.md # protect agent memory from mutation
  - AGENTS.md # protect repository instructions from mutation
risk_tier: L1
scan_status:
  scanner: "tori-core"
  last_scanned: "2026-08-13"
  result: "pass"
