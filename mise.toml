[tools]
node = "22"

[settings]
verbose = true

[tasks.build]
description = "Remove stale build artifacts and rebuild all packages"
run = [
  "find packages -name tsconfig.tsbuildinfo -delete",
  "npm run build",
]

[tasks.clean]
description = "Remove all dist and tsbuildinfo files"
run = [
  "rm -rf packages/ontology/dist packages/core/dist packages/harness/dist packages/cli/dist",
  "find packages -name tsconfig.tsbuildinfo -delete",
]

[tasks.test]
description = "Run tests"
run = "npm test"

[tasks.lint]
description = "Run lint"
run = "npm run lint"

[tasks.ci]
description = "Run full CI pipeline"
run = [
  "mise run build",
  "mise run lint",
  "mise run test",
  "mise run verify",
]

[tasks.verify]
description = "Run core verification scripts"
run = "node packages/core/tests/verify-expansion.mjs && node packages/core/tests/verify-policy-engine.mjs"

[tasks.generate]
description = "Generate agent files"
run = "node packages/cli/dist/cli.js generate"

[tasks.dev]
description = "Build then test"
run = [
  "mise run build",
  "mise run test",
]
