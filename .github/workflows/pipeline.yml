name: Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: ${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.sha }}

  security:
    needs: [ci]
    uses: ./.github/workflows/security.yml
    with:
      ref: ${{ github.sha }}

  changelog:
    needs: [security]
    if: ${{ github.event_name == 'push' && github.actor != 'github-actions[bot]' }}
    uses: ./.github/workflows/changelog.yml
    with:
      ref: ${{ github.sha }}

  release:
    needs: [changelog]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ github.sha }}
      tag: ${{ github.ref_name }}
