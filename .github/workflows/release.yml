name: Release

on:
  workflow_run:
    workflows: [Changelog]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: ${{ github.ref }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        run: |
          TAG=$(git describe --tags --exact-match HEAD 2>/dev/null || true)
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  release:
    runs-on: ubuntu-latest
    needs: [resolve]
    if: ${{ needs.resolve.outputs.tag != '' }}
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: "npm"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build CLI
        run: npm run build -w packages/cli

      - name: Lint
        run: npm run lint

      - name: Verify agent specs compilation
        run: node packages/core/tests/verify-expansion.mjs

      - name: Create GitHub Release
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const tag = '${{ needs.resolve.outputs.tag }}';
            const { execSync } = require('child_process');
            const fs = require('fs');

            let body = '';
            try {
              const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
              const versionMatch = changelog.match(new RegExp('^## \\[' + tag.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\]', 'm'));
              if (versionMatch) {
                const start = changelog.indexOf(versionMatch[0]);
                const nextVersion = changelog.indexOf('\n## [', start + 1);
                body = changelog.slice(start, nextVersion > start ? nextVersion : undefined).trim();
              }
            } catch (err) {
              console.log('CHANGELOG.md not found or section missing, will use generated notes.');
            }

            if (!body) {
              body = await github.rest.repos.generateReleaseNotes({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
              }).then(r => r.data.body);
            }

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: tag,
              body: body,
              draft: true,
            });

      - name: Publish to npmjs
        run: npm publish --workspaces --access public
